name: Backend CI

on:
  push:
    branches:
      - development

  pull_request:
    branches:
      - main

jobs:
  backend-ci:
    name: Build & Verify NestJS Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Unit Tests
        run: npm test

      - name: Build Application
        run: npm run build

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: backend-ci

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: smart-notify-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
